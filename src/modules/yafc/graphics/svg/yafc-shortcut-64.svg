<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <!-- Calculator Body -->
  <rect x="8" y="4" width="48" height="56" rx="8" fill="url(#bodyGrad)" stroke="#0f172a" stroke-width="2.5" filter="url(#shadow)"/>
  <!-- Screen Display -->
  <rect x="14" y="10" width="36" height="14" rx="3" fill="#052e16" stroke="#14532d" stroke-width="1.5"/>
  <!-- Chart / Graph Line on Screen -->
  <path d="M 17,20 L 24,14 L 32,18 L 40,12 L 46,15" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Button Grid -->
  <rect x="14" y="28" width="9" height="7" rx="1.5" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
  <rect x="27.5" y="28" width="9" height="7" rx="1.5" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
  <rect x="41" y="28" width="9" height="7" rx="1.5" fill="#22c55e" stroke="#15803d" stroke-width="1"/>

  <rect x="14" y="38" width="9" height="7" rx="1.5" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
  <rect x="27.5" y="38" width="9" height="7" rx="1.5" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
  <rect x="41" y="38" width="9" height="7" rx="1.5" fill="#94a3b8" stroke="#334155" stroke-width="1"/>

  <rect x="14" y="48" width="9" height="7" rx="1.5" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
  <rect x="27.5" y="48" width="9" height="7" rx="1.5" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
  <rect x="41" y="48" width="9" height="7" rx="1.5" fill="#f97316" stroke="#c2410c" stroke-width="1"/>
</svg>
